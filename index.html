<style type="text/tailwindcss">
@layer base{
  html{scroll-behavior:smooth;-webkit-tap-highlight-color:transparent}
  body{@apply bg-cream text-ink font-sans antialiased;}
  ::selection{background:#F4C542;color:#171717}
  :focus-visible{outline:3px solid #174C78;outline-offset:2px}
}
@layer components{
  .wrap{@apply max-w-7xl mx-auto px-4 sm:px-6 lg:px-10;}
  .btn{@apply inline-flex items-center justify-center gap-2 rounded-full font-bold transition duration-150 select-none active:translate-y-px disabled:opacity-40 disabled:pointer-events-none;}
  .btn-pink{@apply btn bg-pink text-white px-6 py-3.5 border-2 border-ink shadow-hardsm hover:-translate-y-0.5 hover:shadow-hard;}
  .btn-blue{@apply btn bg-blue text-cream px-6 py-3.5 border-2 border-ink shadow-hardsm hover:-translate-y-0.5 hover:shadow-hard;}
  .btn-yellow{@apply btn bg-yellow text-ink px-6 py-3.5 border-2 border-ink shadow-hardsm hover:-translate-y-0.5 hover:shadow-hard;}
  .btn-ghost{@apply btn px-5 py-3 border-2 border-ink/15 bg-white hover:border-ink;}
  .btn-sm{@apply px-4 py-2 text-sm;}
  .chip{@apply inline-flex items-center gap-1.5 rounded-full border-2 border-ink/10 bg-white px-4 py-2 text-sm font-semibold whitespace-nowrap transition hover:border-ink;}
  .chip-on{@apply bg-ink text-cream border-ink;}
  .card{@apply bg-white rounded-3xl border-2 border-ink/10;}
  .kicker{@apply inline-flex items-center gap-2 text-[11px] font-extrabold tracking-[.2em] uppercase;}
  .h-display{@apply font-display font-black tracking-tight leading-[.95];}
  .lbl{@apply block text-[11px] font-extrabold uppercase tracking-[.14em] text-ink/60 mb-1.5;}
  .field{@apply w-full rounded-2xl border-2 border-ink/10 bg-white px-4 py-3 text-[15px] outline-none transition placeholder:text-ink/35 focus:border-blue focus:ring-4 focus:ring-blue/10;}
  .field-err{@apply border-pink focus:border-pink focus:ring-pink/10;}
  .pill{@apply inline-flex items-center gap-1 rounded-full px-2.5 py-1 text-[10px] font-extrabold tracking-[.12em] uppercase whitespace-nowrap;}
  .link-u{@apply underline decoration-2 underline-offset-4 decoration-yellow hover:decoration-pink;}
  .navlink{@apply px-4 py-2 rounded-full text-[13px] font-extrabold tracking-[.14em] transition hover:bg-ink/5;}
  .navlink-on{@apply bg-blue text-cream hover:bg-blue;}
}
</style>
<style>

.marquee{animation:mq 38s linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}
.fade-in{animation:fi .35s cubic-bezier(.2,.7,.2,1) both}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}

.pulse-dot{position:relative}.pulse-dot::after{content:"";position:absolute;inset:-4px;border-radius:999px;background:currentColor;opacity:.35;animation:pd 1.6s ease-out infinite}
@keyframes pd{from{transform:scale(.6);opacity:.5}to{transform:scale(1.6);opacity:0}}
.spin{animation:sp 0.9s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.img-out{filter:grayscale(1) contrast(.9);opacity:.55}
.sheet-in{animation:si .3s cubic-bezier(.2,.8,.2,1) both}@keyframes si{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}

function F(name,label,o={}){
  const req=o.req!==false;

  else if(o.type==='select')input=`<select ${base}>${o.ph?`<option value="">${esc(o.ph)}</option>`:''}${o.opts.map(x=>`<option ${x===o.val?'selected':''}>${esc(x)}</option>`).join('')}</select>`;
  else input=`<input ${base} type="${o.type||'text'}" value="${esc(o.val||'')}" placeholder="${esc(o.ph||'')}">`;
  return `<div class="${o.cls||''}"><label for="f_${name}" class="lbl">${label}${req?' <span class="text-pink">*</span>':''}</label>${input}<p data-err="${name}" class="hidden mt-1.5 text-xs font-bold text-pink"></p></div>`;

/* ----- explore ----- */
function filterVendors(){
  const q=UI.q.toLowerCase(),f=UI.f;
  return db.vendors.filter(v=>{
    if(f==='Vegetarian'&&!v.dishes.some(d=>d.veg))return false;
    if(f==='Non-Vegetarian'&&!v.dishes.some(d=>!d.veg))return false;
    if(f==='Available Now'&&!(v.open&&v.dishes.some(d=>d.status==='available')))return false;
    if(DISH_CATS.includes(f)&&!v.tags.includes(f)&&!v.dishes.some(d=>d.cat===f))return false;
    if(q&&![v.shop,v.owner,v.cat,v.desc,...v.dishes.map(d=>d.name+' '+d.desc)].join(' ').toLowerCase().includes(q))return false;
    return true;
  });
}
function exploreResults(){

function accSection(sec,u){

  if(sec==='events'){const r=db.regs.filter(x=>x.uid===u.id);return r.length?`<div class="grid md:grid-cols-2 gap-4">${r.map(x=>{const e=db.events.find(y=>y.id===x.eid);return `<a href="#/event/${e.id}" class="ticket card overflow-hidden flex hover:border-ink" style="--notch:50%"><img src="${PH(e.img,300)}" class="w-32 object-cover" alt=""><div class="p-5"><div class="font-display font-black text-xl leading-tight">${esc(e.name)}</div><div class="text-xs text-ink/55 font-semibold mt-1">${fDay(e.at)} · ${fTime(e.at)}</div><div class="mt-3 pill bg-blue text-cream">${x.code} · ${x.qty} pass${x.qty>1?'es':''}</div></div></a>`}).join('')}</div>`:empty('ticket','No events yet','Register for a food walk or festival at Tadka Nagri.','<a href="#/events" class="btn-blue">Browse events</a>')}

  if(sec==='favourites'){const f=(db.favs[u.id]||[]).map(V).filter(Boolean);return f.length?`<div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">${f.map(v=>vendorCard(v)).join('')}</div>`:empty('heart','No favourites yet','Tap the heart on a vendor\'s page to keep them close.','<a href="#/explore" class="btn-blue">Explore vendors</a>')}
  if(sec==='locations'){const l=db.locs[u.id]||[];return `<div class="grid gap-3">${l.map(x=>`<div class="card p-5 flex items-center gap-4"><span class="w-11 h-11 rounded-2xl ${x.def?'bg-pink text-white':'bg-cream'} grid place-items-center">${ic(x.label==='Work'?'briefcase':'home')}</span><div><b>${esc(x.label)}</b>${x.def?' <span class="pill bg-pink/10 text-pink ml-1">Default</span>':''}<div class="text-sm text-ink/60">${esc(x.addr)}</div></div><div class="ml-auto flex gap-2">${x.def?'':`<button data-a="locDef" data-l="${x.id}" class="btn-ghost btn-sm">Set default</button>`}<button data-a="locRm" data-l="${x.id}" class="w-10 h-10 rounded-full hover:bg-pink/10 text-pink grid place-items-center" aria-label="Remove">${ic('trash-2','w-4 h-4')}</button></div></div>`).join('')||'<p class="text-ink/50">No saved locations.</p>'}</div>
    <form data-form="loc" class="card p-6 mt-6 grid sm:grid-cols-[160px,1fr,auto] gap-4 items-end" novalidate>${F('label','Label',{type:'select',opts:['Home','Work','Other']})}${F('addr','Area / address',{ph:'[Your Area], [Your City]'})}<button class="btn-blue">${ic('plus','w-4 h-4')}Add</button></form>`}
  if(sec==='support')return `<div class="grid lg:grid-cols-2 gap-8"><div class="space-y-3">${[['How do I collect my order?','After paying you get a QR pickup pass. Show it at each vendor\'s counter. They scan it and hand over your food.'],['Can I order from more than one vendor?','Yes. Add dishes from any stall at Tadka Nagri to one cart. You pay once and the same QR works at every counter.'],['A dish went out of stock after I ordered.','The vendor will tell you at the counter and refund that item to your original payment method within 3 working days.'],['How do refunds work?','Raise a ticket here with your order number. Refunds go back to your UPI app within 3 to 5 working days.'],['Is this real money?','This is a prototype. Payments are simulated and nothing is charged.']].map(([q,a])=>`<details class="card p-5 group"><summary class="font-bold cursor-pointer list-none flex items-center gap-3">${ic('help-circle','w-5 h-5 text-pink shrink-0')}${q}<span class="ml-auto group-open:rotate-45 transition">${ic('plus','w-4 h-4')}</span></summary><p class="mt-3 text-ink/65 text-sm leading-relaxed pl-8">${a}</p></details>`).join('')}</div>

  if(sec==='contact')return contactBlock();
  if(sec==='about')return `<div class="grid lg:grid-cols-2 gap-10 items-center"><div class="space-y-5 text-lg text-ink/75 leading-relaxed"><p class="font-display text-3xl text-ink font-bold leading-snug">Gully &amp; Co. is a home for independent street-food vendors.</p><p>India's best food is cooked on its streets, by people who rarely get the space, tools or credit they deserve. We built <b>Tadka Nagri</b>, a permanent food destination where vendors trade side by side under one roof, with shared seating, clean water and digital ordering.</p><p>Every vendor keeps their name, their recipes and their earnings. We handle discovery, payments and pickup, and through <b>Catering</b> we bring them to offices, colleges, festivals and weddings.</p><div class="flex gap-3 pt-2"><a href="#/explore" class="btn-pink">Explore Tadka Nagri</a><a href="#/catering" class="btn-ghost">Catering</a></div></div><div class="relative"><img src="${PH(IM.stall,900)}" class="arch w-full aspect-[4/5] object-cover border-[3px] border-ink shadow-hard" alt=""><img src="${LOGO}" class="absolute -left-4 -bottom-4 w-32 h-32 rotate-[-6deg] logo object-contain" alt=""></div></div>`;

function parse(){const h=location.hash.replace(/^#\/?/,'');const [path,qs]=h.split('?');return {parts:path.split('/').filter(Boolean),q:new URLSearchParams(qs||'')}}
function go(p){if(location.hash==='#'+p)render();else location.hash=p}
function needAuth(tab='login'){UI.authTab=tab;const cur=location.hash.replace(/^#/,'')||'/home';go('/auth/customer?next='+encodeURIComponent(cur.startsWith('/auth')?'/home':cur))}
function route(){
  const {parts,q}=parse(),[a,b,c]=parts,s=sess();
  if(a==='auth'&&(b==='customer'||b==='vendor'))return vAuth(b);
  if(a==='privacy')return vPrivacy();
  if(a==='welcome')return vWelcome();
  if(!s)return a?(go('/welcome'),''):vWelcome();
  if(s.role==='vendor'){
    if(!myVendor()){LS.del(K.sess);return go('/welcome'),''}
    if(a!=='v')return go('/v/home'),'';
    return ({home:vvHome,orders:vvOrders,feed:vvFeed,account:vvAccount,menu:vvMenu,earnings:vvEarnings}[b]||(()=>(go('/v/home'),'')))();
  }
  if(a==='v')return go('/home'),'';
  if((a==='checkout'||a==='order')&&isGuest())return needAuth(),'';
  switch(a){
    case 'home':return vHome();
    case 'explore':if(q.has('f')||q.has('q')){if(q.has('f'))UI.f=CATS.includes(q.get('f'))?q.get('f'):'All';if(q.has('q'))UI.q=q.get('q');history.replaceState(null,'','#/explore')}return vExplore();
    case 'vendor':return vVendor(b);
    case 'cart':return vCart();
    case 'checkout':return vCheckout();
    case 'order':return vOrder(b);
    case 'events':return vEvents();
    case 'event':return vEvent(b);
    case 'feed':return vFeed();
    case 'account':return vAccount(b);
    case 'catering':return vCatering(b);
    default:return go('/home'),'';
  }
}
let lastPath='';
function render(keepScroll){
  const y=window.scrollY,html=route();
  if(!html)return;

  if(qr&&window.QRCode){qr.innerHTML='';new QRCode(qr,{text:qr.dataset.text,width:220,height:220,colorDark:'#171717',colorLight:'#FFFFFF',correctLevel:QRCode.CorrectLevel.M})}
  else if(qr){qr.innerHTML=`<div class="w-[220px] h-[220px] grid place-items-center text-center text-sm font-bold p-6">${esc(qr.dataset.text.match(/"o":"(\w+)"/)?.[1]||'')}<br>QR library offline</div>`}
  const path=location.hash.split('?')[0];
  if(keepScroll)window.scrollTo(0,y);

    if(/^#\/catering\/\w+/.test(path)&&lastPath.startsWith('#/catering'))setTimeout(()=>$('#cat-form')?.scrollIntoView({behavior:'smooth'}),60);

}

    const id=uid('v');db.vendors.push({id,shop:v.shop,owner:v.name,phone:cleanPhone(v.phone),cat:v.cat,tags:[v.cat],veg:true,price:'₹',open:true,stall:'New stall',hours:'5 PM – 11 PM',since:new Date().getFullYear(),cover:IM.stall,base:[0,0],desc:`Fresh ${v.cat.toLowerCase()} at Tadka Nagri.`,story:`${v.name} just joined Tadka Nagri. Come say hello!`,dishes:[]});

  contact(f){const v=vals(f),e={};if(v.name.length<2)e.name='Enter your name';if(!okPhone(v.phone))e.phone='Enter a valid 10-digit mobile number';if(!reEmail.test(v.email))e.email='Enter a valid email address';if(v.msg.length<10)e.msg='Tell us a little more (at least 10 characters)';if(!showErrs(f,e))return;
    processing(f,'Sending…',()=>{db.contacts.push({...v,at:Date.now()});saveDB();f.outerHTML=`<div class="card border-ink shadow-hardb p-8 md:p-12 text-center pop"><div class="w-16 h-16 mx-auto rounded-full bg-blue text-yellow grid place-items-center">${ic('check','w-8 h-8')}</div><h3 class="font-display font-black text-4xl mt-5">Message received!</h3><p class="text-ink/60 mt-2 max-w-sm mx-auto">Thanks ${esc(v.name.split(' ')[0])}, we'll get back to you on ${esc(v.email)} within a day.</p><button data-a="rerenderBtn" class="btn-ghost btn-sm mt-6">Send another</button></div>`;lucide.createIcons()})},
  addon(f){const v=V(f.dataset.v),d=dishOf(v.id,f.dataset.d);if(d.status!=='available'){closeModal();return toast('Sorry, this just went out of stock','err')}const ad=[...f.querySelectorAll('input[name=ad]:checked')].map(i=>i.value);addToCart(v.id,d.id,ad,+f.qty.value);closeModal();toast(`Added ${d.name}`);rerender()},
  pay(f){doPay(f)},
  reg(f){const u=me();if(!u){toast('Log in to register','info');return needAuth()}const e=db.events.find(x=>x.id===f.dataset.e),q=+f.qty.value;
    const fin=()=>{db.regs.push({id:uid('g'),eid:e.id,uid:u.id,qty:q,total:e.price*q,code:'TN-'+Math.random().toString(36).slice(2,7).toUpperCase(),at:Date.now()});saveDB();UI.busy=false;closeModal();toast(e.price?'Tickets booked!':'You\'re registered!');rerender()};
    if(!e.price)return processing(f,'Registering…',fin);
    UI.busy=true;modal(payProcessing(`Paying ${rs(e.price*q)}…`));setTimeout(fin,1500)},
  comment(f){const u=me();if(!u){toast('Log in to comment','info');return needAuth()}const t=vals(f).text;if(!t)return toast('Write something first','err');db.posts.find(p=>p.id===f.dataset.p).comments.push({name:u.name,text:t,at:Date.now()});saveDB();rerender()},
  review(f){const v=vals(f),e={};if(!v.rating)e.rating='Pick a star rating';if((v.text||'').length<10)e.text='Write at least 10 characters';if(!showErrs(f,e))return;
    const [oid,vid]=v.pick.split('|'),o=db.orders.find(x=>x.id===oid),u=me();
    db.reviews.push({id:uid('r'),vid,cid:u.id,cname:u.name,rating:+v.rating,text:v.text,dish:v.dish,at:Date.now()});
    db.posts.push({id:uid('p'),cid:u.id,name:u.name,vid,text:v.text,img:v.img||dishOf(vid,o.items.find(i=>i.name===v.dish)?.did)?.img||'',at:Date.now(),likes:[],likeBase:0,kind:'review',rating:+v.rating,comments:[]});
    o.reviewed[vid]=true;saveDB();closeModal();toast('Review posted! The vendor can see it now.');if(location.hash.startsWith('#/order'))rerender();else go('/feed')},
  profile(f){const v=vals(f),u=me(),e={};if(v.name.length<2)e.name='Enter your full name';if(!reEmail.test(v.email))e.email='Enter a valid email address';else if(db.users.some(x=>x.id!==u.id&&x.email?.toLowerCase()===v.email.toLowerCase()))e.email='Email already in use';if(!okPhone(v.phone))e.phone='Enter a valid 10-digit mobile number';if(!showErrs(f,e))return;
    Object.assign(u,{name:v.name,email:v.email,phone:cleanPhone(v.phone),avatar:v.avatar||''});db.posts.forEach(p=>{if(p.cid===u.id)p.name=u.name});db.reviews.forEach(r=>{if(r.cid===u.id)r.cname=u.name});db.orders.forEach(o=>{if(o.cid===u.id)o.cname=u.name});saveDB();toast('Profile updated');go('/account')},
  loc(f){const v=vals(f),e={};if((v.addr||'').length<3)e.addr='Enter an area or address';if(!showErrs(f,e))return;const u=me(),l=db.locs[u.id]=db.locs[u.id]||[];l.push({id:uid('l'),label:v.label,addr:v.addr,def:!l.length});saveDB();toast('Location added');rerender()},
  ticket(f){const v=vals(f),e={};if(v.order&&!/^GC\d{3,}$/i.test(v.order))e.order='Order numbers look like GC4120';if(v.msg.length<10)e.msg='Please describe the issue (10+ characters)';if(!showErrs(f,e))return;processing(f,'Submitting…',()=>{const id='T'+Math.floor(1e4+Math.random()*9e4);db.tickets.push({id,...v,uid:me()?.id,at:Date.now()});saveDB();f.innerHTML=`<div class="text-center py-6 pop"><div class="w-14 h-14 mx-auto rounded-full bg-blue text-yellow grid place-items-center">${ic('check','w-7 h-7')}</div><h3 class="font-display font-black text-3xl mt-4">Ticket ${id} raised</h3><p class="text-ink/60 mt-2">Our support team will reply within 24 hours.</p></div>`;lucide.createIcons()})},
  catering(f){const v=vals(f),e={},t=new Date();t.setHours(0,0,0,0);
    if(v.name.length<2)e.name='Enter your name';if(v.org.length<2)e.org='Enter an organisation or event name';if(!okPhone(v.phone))e.phone='Enter a valid 10-digit Indian mobile number';if(!reEmail.test(v.email))e.email='Enter a valid email address';
    if(!v.date)e.date='Choose your event date';else if(new Date(v.date+'T00:00')<t)e.date='Event date can\'t be in the past';else if(new Date(v.date)>new Date(Date.now()+730*DAY))e.date='We take enquiries up to 2 years ahead';
    if(v.loc.length<3)e.loc='Enter the event location';if(!(+v.guests>=10))e.guests='Minimum 10 guests';else if(+v.guests>50000)e.guests='For 50,000+ guests, please call us';if(!v.food)e.food='Choose a food type';if(!v.budget)e.budget='Choose a budget range';if(!showErrs(f,e))return;
    processing(f,'Sending your request…',()=>{const ref='CAT-'+Math.floor(1e4+Math.random()*9e4);db.enquiries.push({ref,...v,at:Date.now(),status:'new'});saveDB();
      $('#catBox').innerHTML=`<div class="card border-ink shadow-hardb p-8 md:p-12 pop"><div class="w-20 h-20 rounded-full bg-pink text-white grid place-items-center border-[3px] border-ink">${ic('send','w-9 h-9')}</div><h2 class="h-display text-5xl md:text-6xl mt-6">We'll get in touch with you.</h2><p class="text-lg text-ink/65 mt-4 max-w-xl">Thanks ${esc(v.name.split(' ')[0])}. Your catering request for <b>${esc(v.type.toLowerCase())}</b> on <b>${new Date(v.date).toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'})}</b> has reached our events team. Expect a call on +91 ${esc(cleanPhone(v.phone))} within one working day.</p>
      <div class="mt-6 inline-flex items-center gap-2 rounded-full bg-yellow/60 border-2 border-ink px-4 py-2 font-bold text-sm">${ic('hash','w-4 h-4')}Reference ${ref}</div><p class="text-sm text-ink/50 mt-3">This is an enquiry, not a confirmed booking.</p>
      <div class="grid sm:grid-cols-3 gap-3 mt-8"><a href="${CONTACT.wa}?text=${encodeURIComponent('Hi Gully & Co., following up on catering enquiry '+ref)}" target="_blank" rel="noopener" class="btn-blue">${ic('message-circle')}WhatsApp</a><a href="tel:${CONTACT.tel}" class="btn-ghost">${ic('phone')}Call</a><a href="mailto:${CONTACT.email}?subject=${encodeURIComponent('Catering enquiry '+ref)}" class="btn-ghost">${ic('mail')}Email</a></div>
      <button data-a="rerenderBtn" class="mt-6 text-sm font-bold link-u">Send another enquiry</button></div>`;lucide.createIcons();$('#catBox').scrollIntoView({behavior:'smooth',block:'start'})})},
  dish(f){const v=vals(f),e={},ven=myVendor();if(v.name.length<2)e.name=T('dishName');if(!(+v.price>0))e.price=T('price');if(!showErrs(f,e))return;
    const data={name:v.name,price:Math.round(+v.price),cat:v.cat,status:v.status||'available',veg:v.veg!=='0',desc:v.desc||''};
    if(f.dataset.d){const d=ven.dishes.find(x=>x.id===f.dataset.d);Object.assign(d,data);if(v.img)d.img=v.img}
    else ven.dishes.push({id:uid('d'),...data,img:v.img||IM.toppings,addons:[]});
    if(!ven.tags.includes(data.cat))ven.tags.push(data.cat);saveDB();closeModal();toast(T('updated'));rerender()},
  shop(f){const v=vals(f),e={},ven=myVendor(),u=me();if(v.owner.length<2)e.owner='Name';if(v.shop.length<2)e.shop='Shop';if(!okPhone(v.phone))e.phone='Mobile';if(!showErrs(f,e))return;Object.assign(ven,{owner:v.owner,shop:v.shop,phone:cleanPhone(v.phone),stall:v.stall,hours:v.hours,desc:v.desc});Object.assign(u,{name:v.owner,phone:cleanPhone(v.phone)});saveDB();closeModal();toast(T('updated'));rerender()},
  scanNo(f){const n=(vals(f).no||'').toUpperCase().replace(/\s/g,'');if(!n)return toast(T('enterNo'),'err');const id=n.startsWith('GC')?n:'GC'+n;if(!db.orders.some(o=>o.id===id))return toast(T('notFound'),'err');stopScanner();handleScan(id)}
};
A.rerenderBtn=()=>rerender();
function afterLogin(def){const nx=new URLSearchParams(location.hash.split('?')[1]||'').get('next');go(nx&&nx.startsWith('/')?nx:def)}
async function processing(f,label,done){const b=f.querySelector('button:not([type=button])');if(b?.disabled)return;const h=b.innerHTML;b.disabled=true;b.innerHTML=`<span class="w-5 h-5 rounded-full border-[3px] border-current border-t-transparent spin"></span>${label}`;await wait(1100);try{done()}finally{if(b.isConnected){b.disabled=false;b.innerHTML=h;lucide.createIcons()}}}
async function doPay(f){
  if(UI.busy)return;const v=vals(f),e={};if(v.name.length<2)e.name='Enter a name for pickup';if(!okPhone(v.phone))e.phone='Enter a valid 10-digit mobile number';if(v.pay==='UPI ID'&&!/^[\w.\-]{2,}@[A-Za-z]{2,}$/.test(v.upi||''))e.upi='Enter a valid UPI ID, like name@bank';if(!showErrs(f,e))return;
  let lines=cartLines();if(!lines.length)return toast('Your cart is empty','err');if(lines.some(l=>l.prob)){toast('Some items are no longer available','err');return go('/cart')}
  UI.busy=true;const btn=$('#payBtn');if(btn)btn.disabled=true;
  modal(payProcessing(`Opening ${esc(v.pay)}…`));$('#modal [data-a=closeModal]')?.classList.add('hidden');
  await wait(1000);const h=$('#modal h3');if(h)h.textContent='Confirming payment…';await wait(1100);
  loadDB();lines=cartLines();
  if(lines.some(l=>l.prob)){UI.busy=false;closeModal();toast('A vendor just updated their menu. Please review your cart.','err');return go('/cart')}
  const u=me(),c=charges(lines),num=Math.max(4100,...db.orders.map(o=>+o.id.slice(2)||0))+1,vs={};
  lines.forEach(l=>vs[l.vid]='placed');
  const o={id:'GC'+num,cid:u.id,cname:v.name,cphone:cleanPhone(v.phone),note:v.note,items:lines.map(l=>({vid:l.vid,did:l.did,name:l.d.name,price:l.price,qty:l.qty,addons:l.addons})),...c,at:Date.now(),vs,pay:v.pay==='UPI ID'?v.upi:v.pay,reviewed:{}};
  db.orders.push(o);saveDB();setCart([]);UI.busy=false;closeModal();go('/order/'+o.id+'?new=1');
}

/* ============ events ============ */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el||el.tagName==='INPUT'||el.tagName==='SELECT')return;
  const fn=A[el.dataset.a];if(!fn)return;
  if(el.tagName==='A'&&el.dataset.a!=='closeModal'&&el.dataset.a!=='ordTabGo')e.preventDefault();
  if(el.dataset.a==='closeModal'&&el.tagName==='A'){closeModal();return}
  fn(el,e);
});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();const fn=FORMS[f.dataset.form];fn&&fn(f)});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='exq'){UI.q=t.value;const r=$('#exres');if(r){r.innerHTML=exploreResults();lucide.createIcons()}t.parentElement.querySelector('[data-a=clearQ]')?.classList.toggle('hidden',!t.value)}
  if(t.classList.contains('field-err')){t.classList.remove('field-err');const p=t.form?.querySelector(`[data-err="${t.name}"]`);p&&p.classList.add('hidden')}
});
document.addEventListener('change',async e=>{
  const t=e.target,a=t.dataset.a;
  if(t.name==='ad')updSum(t.form);
  if(a==='payPick'){UI.pay=t.value;$('#upiBox')?.classList.toggle('hidden',t.value!=='UPI ID')}
  if(a==='starPick'){const n=+t.value;t.form.querySelectorAll('[data-star]').forEach(s=>{const on=+s.dataset.star<=n;s.classList.toggle('text-yellow',on);s.classList.toggle('text-ink/20',!on);s.querySelector('svg')?.classList.toggle('fill-yellow',on)});const p=t.form.querySelector('[data-err=rating]');p&&p.classList.add('hidden')}
  if(a==='pickChange'){const [oid,vid]=t.value.split('|'),o=db.orders.find(x=>x.id===oid);$('#revDish').innerHTML=vendorPart(o,vid).map(i=>`<option>${esc(i.name)}</option>`).join('')}
  const file=t.files&&t.files[0];if(!file)return;
  try{
    if(a==='revImg'){const d=await shrinkImage(file);$('#revImg').value=d;$('#revImgLbl').textContent='Photo added ✓'}
    if(a==='avatarPick'){const d=await shrinkImage(file,320);t.form.avatar.value=d;$('#avPrev').innerHTML=`<img src="${d}" class="w-32 h-32 rounded-full object-cover mx-auto border-4 border-white shadow-hardsm" alt="">`}
    if(a==='dishImg'){const d=await shrinkImage(file,640),v=myVendor();v.dishes.find(x=>x.id===t.dataset.d).img=d;saveDB();toast(T('updated'));rerender()}
    if(a==='dishFormImg'){const d=await shrinkImage(file,640);t.form.img.value=d;const p=$('#dishPrev');p.src=d;p.classList.remove('hidden')}
    if(a==='qrFile'){stopScanner();if(!window.Html5Qrcode)throw new Error(T('cameraOff'));const r=new Html5Qrcode('readerFile');try{const txt=await r.scanFile(file,false);handleScan(txt)}catch(err){toast('No QR code found in that image','err')}finally{try{r.clear()}catch(x){}}}
  }catch(err){toast(err.message||'Could not use that file','err')}
  t.value='';
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal').innerHTML)A.closeModal()});
window.addEventListener('hashchange',()=>{UI.menu=false;if(!UI.busy&&$('#modal').innerHTML&&!document.querySelector('#modal form[data-form=review]'))closeModal();render()});
window.addEventListener('storage',e=>{
  if(e.key===K.db){loadDB();const a=document.activeElement;if(!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&$('#app').contains(a)))rerender()}
  else if(e.key===K.cart){setCart(cart());if(/#\/(cart|vendor|checkout)/.test(location.hash))rerender()}
  else if(e.key===K.sess||e.key===K.lang)rerender();
});

/* ============ boot ============ */
loadDB();
if(!location.hash||location.hash==='#'||location.hash==='#/'){const s=sess();history.replaceState(null,'',s?(s.role==='vendor'?'#/v/home':'#/home'):'#/welcome')}
render();
</script>
